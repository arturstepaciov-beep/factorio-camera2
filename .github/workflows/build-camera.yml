name: Build camera test DLL
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download original source
        uses: actions/checkout@v4
        with:
          repository: GDani31/factorio-3d-mod
          ref: 9da9769c2a9c6eb3f2fba4ebebb6d3d718df0e01
          persist-credentials: false
      - name: Apply camera adjustments
        shell: python {0}
        run: |
          import base64, pathlib, subprocess
          patch = pathlib.Path("camera-test.patch")
          patch.write_bytes(base64.b64decode(""))
          subprocess.run(["git", "apply", "--check", str(patch)], check=True)
          subprocess.run(["git", "apply", str(patch)], check=True)
      - name: Build Windows DLL
        shell: pwsh
        run: cargo build --release --locked -p factorio_3d_models
      - name: Package test settings
        shell: pwsh
        run: |
          New-Item -ItemType Directory camera-test | Out-Null
          Copy-Item target/release/factorio_3d_models.dll camera-test/
          @'
          Experimental camera test for Factorio 2.0.77. Not tested in-game.
          Close Factorio before replacing any files.
          Back up your existing factorio_3d_models.dll, then replace it with this DLL.
          Keep your existing injector and models folder.
          In your EXISTING f3dm_tuning.txt, add or update these lines:
          fps_eye_height=0.85
          view_target_span=220
          view_max_boost=4
          Run Factorio and the injector as before.
          Settings reload while playing. Try fps_eye_height=0.5 or 1.2 to calibrate.
          0.85 is a trial value, not a confirmed correct height.
          Engine zoom limits may prevent reaching the requested terrain coverage.
          Higher coverage can reduce performance and terrain sharpness.
          This does not change the player model or add unlimited render distance.
          To revert: close Factorio and restore the backed-up DLL.
          Source: GDani31/factorio-3d-mod commit 9da9769c2a9c6eb3f2fba4ebebb6d3d718df0e01
          '@ | Set-Content camera-test/READ-ME.txt
      - name: Upload DLL and instructions
        uses: actions/upload-artifact@v4
        with:
          name: Factorio-camera-test
          path: camera-test/
          if-no-files-found: error
